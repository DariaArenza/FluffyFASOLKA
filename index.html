<style>
  html,body{margin:0;height:100%;background:#433F7A;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif}
  canvas{display:block;position:fixed;inset:0}
  #pauseBtn{position:fixed;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,248,238,.92);border:1.5px solid #E0D7F3;box-shadow:none;color:#7A5CC7;display:none;align-items:center;justify-content:center;z-index:6;cursor:pointer;box-sizing:border-box}
  #pauseBtn svg{width:14px;height:14px}
  #menuBtn{position:fixed;top:10px;right:52px;width:34px;height:34px;border-radius:50%;background:rgba(255,248,238,.92);border:1.5px solid #E0D7F3;color:#7A5CC7;display:none;align-items:center;justify-content:center;z-index:6;cursor:pointer;box-sizing:border-box}
  #menuBtn svg{width:15px;height:15px}
  :root{--acc:#8F73D6;--accD:#8266CC;--rib:#7A5CC7}
  .biomes{display:flex;gap:8px;margin-top:2px}
  .bio{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:1.5px solid #E0D7F3;border-radius:16px;padding:7px 4px 6px;font:700 11.5px -apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;color:#5B4A8E;cursor:pointer}
  .bio svg{width:30px;height:30px}.bio.on{border-color:var(--acc);background:#FBF7FF;box-shadow:0 0 0 2px var(--acc) inset}
  .bio small{font-size:9.5px;font-weight:700;color:#A79BC9}
  .lbl{font-size:11px;font-weight:800;color:#A79BC9;letter-spacing:.6px;text-transform:uppercase;margin-top:4px}
  #menu,#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(78,60,150,.58);z-index:8}
  #ov{display:none;z-index:10}
  .card{font-family:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;position:relative;width:min(286px,84vw);box-sizing:border-box;background:#FFF8EE;border:2px solid #6B5A9E;border-radius:24px;box-shadow:0 4px 0 rgba(62,54,114,.45);padding:44px 18px 16px;display:flex;flex-direction:column;gap:8px;text-align:center;color:#4B3F78}
  .card::before{content:"";position:absolute;inset:7px;border:2px dashed #D9CCF3;border-radius:19px;pointer-events:none}
  .card .sprig{position:absolute;top:-30px;width:40px;height:60px}.card .sprig svg{width:100%;height:100%}
  .card .sprig.l{left:6px;transform:rotate(-22deg)}.card .sprig.r{right:6px;transform:rotate(22deg) scaleX(-1)}
  .ribbon{position:absolute;left:50%;top:-28px;transform:translateX(-50%);width:220px;height:54px}
  .ribbon svg{position:absolute;inset:0;width:100%;height:100%}
  .ribbon span{position:absolute;left:0;right:0;top:6px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:25px;font-weight:800;letter-spacing:.5px}
  .card .ms{font-size:15px;font-weight:700;color:#7A5CC7;margin-top:2px}
  .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:4px;min-height:24px}
  .tag{display:inline-flex;align-items:center;gap:5px;background:#EEE7FB;border-radius:12px;padding:3px 9px 3px 6px;font-size:12.5px;font-weight:700;color:#5B4A8E}
  .tag svg{width:16px;height:16px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;background:#FFFFFF;border:1.5px solid #E0D7F3;border-radius:999px;box-shadow:none;padding:7px 16px 7px 8px;color:#5B4A8E;font:700 14.5px -apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;cursor:pointer;transition:transform .1s,background .15s;-webkit-tap-highlight-color:transparent}
  .btn:active{transform:scale(.97);background:#F6F2FE}
  .btn .ic{width:26px;height:26px;flex:none;border-radius:50%;background:#F1ECFB;display:flex;align-items:center;justify-content:center;color:#7A5CC7}
  .btn .ic svg{width:17px;height:17px}
  .btn.big{background:var(--acc);border-color:var(--acc);color:#fff;font-size:16px;padding:9px 20px 9px 10px;margin-top:2px}.btn.big:active{background:var(--accD)}
  .btn.big .ic{background:rgba(255,255,255,.22);color:#fff;width:28px;height:28px}
  .btn.soft{background:transparent;border-color:transparent;color:#8A7FB0;font-size:13px;padding:4px 10px}.btn.soft .ic{width:22px;height:22px;background:transparent;color:#8A7FB0}.btn.soft:active{background:#F3EEFC}
  .row{display:flex;gap:8px;margin-top:6px}.row .btn{flex:1;min-width:0;font-size:13px;padding:6px 8px 6px 6px;gap:6px;justify-content:flex-start}.row .btn .ic{width:26px;height:26px;background:#F6F2FE}
  .btn .st{margin-left:auto;flex:none;width:9px;height:9px;border-radius:50%;background:#7CC862;box-shadow:0 0 0 3px rgba(124,200,98,.22);margin-right:2px;transition:background .15s,box-shadow .15s}
  .btn .st.off{background:#CFC7E2;box-shadow:0 0 0 3px rgba(207,199,226,.25)}
  .row .btn{position:relative}.row .btn .st{position:absolute;left:25px;top:5px;margin:0;width:9px;height:9px;box-shadow:0 0 0 2px #fff}.row .btn .st.off{box-shadow:0 0 0 2px #fff}
  .row .btn span{white-space:nowrap}
  .keys{font-size:11.5px;color:#7A6E9E;line-height:1.5;margin-top:2px}
  .stars{font-size:36px;letter-spacing:4px;color:#F7C844;margin:2px 0}.stars .off{color:#E2DAF2}
  #stats{font-size:14px;line-height:1.55}
</style>

  <div class="ribbon"><svg viewBox="0 0 300 70" preserveAspectRatio="none"><path d="M0 22 H44 V62 H0 L14 42 Z" fill="#5B4A8E"/><path d="M300 22 H256 V62 H300 L286 42 Z" fill="#5B4A8E"/><path d="M34 54 L44 62 V54Z" fill="#3E3672"/><path d="M266 54 L256 62 V54Z" fill="#3E3672"/><rect x="30" y="8" width="240" height="46" rx="10" style="fill:var(--rib)"/><rect x="38" y="15" width="224" height="32" rx="6" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.6" stroke-dasharray="5 4"/></svg><span>Fasolka</span></div>

    <button id="bMist" class="btn tog"><i class="ic"><svg viewBox="0 0 24 24"><path d="M6.5 15.5a4 4 0 0 1 .6-7.9A5.5 5.5 0 0 1 17.6 9a3.3 3.3 0 0 1 .4 6.5z" fill="#C9B6F2"/><path d="M8.6 8.2a3.6 3.6 0 0 1 5.6-1.3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M5 18.5c2-1.3 3.5 1.3 5.5 0s3.5 1.3 5.5 0 2.5.8 3 .5" stroke="#8F73D6" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M7 21.5c1.6-1 3 1 4.6 0s3 1 4.4 0" stroke="#B597E8" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></i><span>Mgła</span><b class="st"></b></button>
    <button id="bSfx" class="btn tog"><i class="ic" id="sfxIc"></i><span>Efekty</span><b class="st"></b></button>
  </div>
  <div class="row">
    <button id="bMus" class="btn tog"><i class="ic"><svg viewBox="0 0 24 24"><path d="M9 17V6.5l10.5-2.5V15" fill="none" stroke="#5B4A8E" stroke-width="2" stroke-linejoin="round"/><path d="M9 6.5l10.5-2.5v3L9 9.5z" fill="#F7C844"/><ellipse cx="6.4" cy="17.4" rx="3.2" ry="2.6" fill="#F38DB5"/><ellipse cx="16.9" cy="15.4" rx="3.2" ry="2.6" fill="#8F73D6"/><circle cx="5.4" cy="16.6" r=".9" fill="#fff"/><circle cx="15.9" cy="14.6" r=".9" fill="#fff"/></svg></i><span>Muzyka</span><b class="st"></b></button>
    <button id="bAmb" class="btn tog"><i class="ic"><svg viewBox="0 0 24 24"><path d="M11 2.5C7 8 5 11.2 5 14.3a6 6 0 0 0 12 0c0-3.1-2-6.3-6-11.8z" fill="#7EC8F2"/><path d="M8 14.5a3 3 0 0 0 3 3" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M15.5 21.5c0-4.5 2.5-7.5 6-8-.3 4.4-2.6 7.4-6 8z" fill="#7CC862"/><path d="M15.8 21.2l4.2-6" stroke="#5FAA4B" stroke-width="1.1" stroke-linecap="round"/></svg></i><span>Otoczenie</span><b class="st"></b></button>
  </div></div>

</div></div>

" fill="#3E3672"/><rect x="30" y="8" width="240" height="46" rx="10" style="fill:var(--rib)"/><rect x="38" y="15" width="224" height="32" rx="6" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.6" stroke-dasharray="5 4"/></svg><span>Brawo!</span></div><div class="ms">Złoty ser zdobyty</div><div id="stats"></div>

<script>
var needFar=true;var BI=0;try{BI=+localStorage.getItem('fasolka_biome')||0;}catch(e){}if(!(BI>=0&&BI<=1))BI=0;var SK=BI?'_'+BI:'';
const BIOMES=[{name:'Lawendowa wieża',side:'#3E3672',menu:'rgba(78,60,150,.58)',acc:'#8F73D6',accD:'#8266CC',rib:'#7A5CC7',mist:[232,222,255],mistDot:'181,151,232',mistTxt:'Mgła się podnosi!',hz:'mgłą'},
  {name:'Wiśniowy ogród',side:'#5A3A6E',menu:'rgba(150,72,135,.52)',acc:'#E07AA8',accD:'#D0689A',rib:'#D9669A',mist:[255,234,245],mistDot:'240,150,190',mistTxt:'Chmury się podnoszą!',hz:'chmurami'}];
const BD=BIOMES[BI];
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const W=360;let S=1,VW=360,VH=640,OX=0,dpr=1,GX=0,GW=360;
const BIOME={side:BD.side,menu:BD.menu};
function resize(){needFar=true;dpr=Math.min(3,devicePixelRatio||1);const iw=innerWidth,ih=innerHeight;
  if(iw/ih>.62){GW=Math.min(iw,ih*9/16);S=GW/W;VW=W;VH=ih/S;GX=(iw-GW)/2;}else{S=Math.min(iw/W,ih/560);VW=iw/S;VH=ih/S;GX=0;GW=iw;}OX=(VW-W)/2;
  const pb=document.getElementById('pauseBtn');if(pb)pb.style.right=(GX+10)+'px';const mb=document.getElementById('menuBtn');if(mb)mb.style.right=(GX+50)+'px';
  cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
addEventListener('resize',resize);resize();
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;if(isTouch)document.body.classList.add('touch');

/* ===== PALETA – hierarchia: tło jasne i mgliste, ścieżka nasycona ===== */
const C={sky1:'#6C99E2',sky2:'#AFCFF7',ray:'rgba(255,255,255,.07)',
 far:'#A3C2F2',far2:'#95B7EE',cloud:'#C4DBF8',
 mid:'#84A5E3',midTop:'#9DC6C0',midFall:'#BFE2FA',
 nb:'#6E8FD8',nbTop:'#7FB5A8',
 wall:'#433F7A',wallL:'#4E4A8D',wallB:'#4C4888',wallBL:'#5E5AA3',wMoss:'#5FA47F',
 rock:'#55519A',rockL:'#6662AE',rockD:'#48448A',
 grass:'#8ED36B',grassL:'#B6E78E',grassD:'#6CBB54',
 vine:'#4E9E62',vleaf:'#6CC07A',
 lw1:'#3F8F86',lw2:'#56A898',lw3:'#2E6E74',lw4:'#2A5F6A',
 lav:'#B597E8',lavD:'#9479D6',stem:'#4F8F6E',
 wood:'#9A6648',woodD:'#6E4434',rope:'#C9A27E',
 cheese:'#F7C844',cheeseD:'#E3A52C',crys:'#A9DDF8',crysL:'#E2F5FF',
 spike:'#B9A4E8',spikeD:'#9C88D2',shroom:'#B79AE0',ink:'#2E2A36',stone:'#7D7AA8',stoneL:'#9693C0'};

function rng(s){s=Math.abs(Math.floor(s))%2147483646+1;return()=>(s=(s*16807)%2147483647)/2147483647;}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function ell(x,y,rx,ry,a){ctx.beginPath();ctx.ellipse(x,y,rx,ry,a||0,0,Math.PI*2);ctx.fill();}
function leaf(x,y,len,wid,ang,col){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(len*.45,-wid,len,0);ctx.quadraticCurveTo(len*.45,wid,0,0);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(len*.1,0);ctx.lineTo(len*.85,0);ctx.stroke();ctx.restore();}
function lavender(x,y,h,ang,col,stem){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.strokeStyle=stem||C.stem;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-h);ctx.stroke();
  ctx.fillStyle=col||C.lav;for(let i=0;i<6;i++){const yy=-h*.45-i*h*.1;ell(i%2?2:-2,yy,2.4,3.2,i%2?.5:-.5);}ell(0,-h-1,2,3);ctx.restore();}
function flower(x,y,r,col,mid){ctx.fillStyle=col||'#fff';for(let i=0;i<5;i++){const a=i*1.2566-1.57;circ(x+Math.cos(a)*r,y+Math.sin(a)*r,r*.75);}ctx.fillStyle=mid||C.cheese;circ(x,y,r*.55);}
function archPath(x,y,r,top){ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x-r,y-top);ctx.arc(x,y-top,r,Math.PI,0);ctx.lineTo(x+r,y);ctx.closePath();}
function archWall(x,y,w,h,n){ctx.beginPath();ctx.rect(x,y,w,h);const g=w/n,aw=g*.6;for(let i=0;i<n;i++){const ax=x+i*g+(g-aw)/2,ay=y+h*.25+aw/2;ctx.moveTo(ax,y+h);ctx.lineTo(ax,ay);ctx.arc(ax+aw/2,ay,aw/2,Math.PI,0);ctx.lineTo(ax+aw,y+h);ctx.closePath();}
  ctx.fill('evenodd');rr(x-5,y-7,w+10,10,4);ctx.fill();}

  for(const r of ropes){const on=P.plat===r&&P.onG,tg=on?7*Math.sin(Math.PI*Math.max(0,Math.min(1,(P.x+P.w/2-r.x)/r.w))):0;r.dip+=(tg-r.dip)*Math.min(1,dt*7);}

  if(mist.on&&!won&&P.dead<=0&&mist.y-(P.y+P.h)<120){ctx.globalAlpha=.6+.4*Math.sin(T*8);ctx.textAlign='center';ctx.fillStyle='rgba(107,90,142,.85)';rr(VW/2-72,70,144,24,12);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='700 12px Roboto,Helvetica,Arial,sans-serif';ctx.fillText(BD.mistTxt,VW/2,82);ctx.textAlign='left';ctx.globalAlpha=1;}
  if(isTouch){const zs=[[VW*.125,'◀',TK.left],[VW*.375,'▶',TK.right],[VW*.75,'▲',TK.jump]];ctx.textAlign='center';ctx.font='700 20px Roboto,Helvetica,Arial,sans-serif';
    for(const [x,t,on] of zs){ctx.fillStyle=`rgba(255,255,255,${on?.38:.16})`;circ(x,VH-54,28);ctx.fillStyle=`rgba(255,255,255,${on?.95:.6})`;ctx.fillText(t,x,VH-53);}ctx.textAlign='left';}
  if(T-tipT<3.2&&!won){ctx.globalAlpha=Math.min(1,(3.2-(T-tipT))*2,(T-tipT)*4);ctx.textAlign='center';ctx.font='700 13px Roboto,Helvetica,Arial,sans-serif';const tw=ctx.measureText(tipTxt).width+32;
    ctx.fillStyle='rgba(255,253,248,.95)';rr(VW/2-tw/2,96,tw,30,15);ctx.fill();ctx.fillStyle='#4B3F78';ctx.fillText(tipTxt,VW/2,111);ctx.textAlign='left';ctx.globalAlpha=1;}
  if(T-playT<8){ctx.globalAlpha=Math.min(1,(8-(T-playT))/1.5);ctx.textAlign='center';const hy=isTouch?VH-112:VH-50;ctx.fillStyle='rgba(46,47,85,.75)';rr(VW/2-170,hy-14,340,28,14);ctx.fill();ctx.fillStyle='#fff';ctx.font='600 12px Roboto,Helvetica,Arial,sans-serif';
    ctx.fillText(isTouch?'Lewa strona – kierunek · prawa – skok'+(mistEnabled?' · uciekaj przed '+BD.hz+'!':''):'← → kierunek · Spacja skok · w górę!'+(mistEnabled?' Uciekaj przed '+BD.hz+'!':''),VW/2,hy);ctx.textAlign='left';ctx.globalAlpha=1;}}
function drawTitle(){const cxx=VW/2,ty=VH*.2;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(67,63,122,.82)';rr(cxx-130,ty-50,260,112,26);ctx.fill();
  ctx.fillStyle='#FFFDF8';ctx.font='800 42px Roboto,Helvetica,Arial,sans-serif';ctx.fillText('Fasolka',cxx,ty-8);
  ctx.fillStyle='#D9CCFA';ctx.font='600 15px Roboto,Helvetica,Arial,sans-serif';ctx.fillText('Lawendowa wieża',cxx,ty+30);
  for(let i=0;i<2;i++){ctx.save();ctx.translate(cxx+(i?100:-100),ty-40);ctx.scale(.7,.7);flower(0,0,6,i?'#F7C6CF':'#FFFFFF');ctx.restore();}
  let best=null;try{best=localStorage.getItem('fasolka_best'+SK);}catch(e){}
  ctx.fillStyle='rgba(255,253,248,.88)';rr(cxx-110,ty+74,220,30,15);ctx.fill();ctx.fillStyle=C.ink;ctx.font='600 13px Roboto,Helvetica,Arial,sans-serif';
  ctx.fillText(`Czapeczki: ${owned.length}/3`+(best?`  ·  Rekord: ${best} s`:''),cxx,ty+89);
  ctx.globalAlpha=.8+.2*Math.sin(T*3);ctx.fillStyle='rgba(67,63,122,.85)';rr(cxx-110,VH*.5-16,220,32,16);ctx.fill();ctx.fillStyle='#fff';ctx.font='700 14px Roboto,Helvetica,Arial,sans-serif';
  ctx.fillText(isTouch?'Dotknij, aby zacząć':'Naciśnij klawisz, aby zacząć',cxx,VH*.5);ctx.globalAlpha=1;ctx.textAlign='left';}
let dt0=0;
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);if(GX>0){ctx.fillStyle=BIOME.side;ctx.fillRect(0,0,innerWidth,innerHeight);}
  ctx.setTransform(S*dpr,0,0,S*dpr,GX*dpr,0);ctx.save();ctx.beginPath();ctx.rect(0,0,VW,VH);ctx.clip();drawBG();
  ctx.save();ctx.translate(OX,-camY);const y0=camY-60,y1=camY+VH+60,vis=(a,b)=>b>y0-80&&a<y1+80;
  for(const f of sideFalls)if(vis(f.y,f.y+f.h))sideFall(f);
  if(BI===1)drawSakSides(y0,y1);else drawWalls(y0,y1);
  for(const n of niches)if(vis(n.y-40,n.y))drawNiche(n);
  if(vis(GROUND-80,GROUND+80))drawStart();
  if(vis(TOP-120,TOP+20))drawShrine();
  for(const f of pfalls)if(vis(f.y0,f.y1))drawPFall(f);
  for(const wh of wheels)if(vis(wh.cy-80,wh.cy+80))drawWheel(wh);
  for(const r of ropes)if(vis(r.y-30,r.y+30))drawRope(r);
  for(const l of lifts)if(vis(l.y-110,l.y+20))drawLift(l);
  for(const b of blowers)if(vis(b.y-b.h,b.y))drawBlower(b);
  for(const p of plats){if(p.t==='beam'||p.t==='rope'||p.t==='lift'||p.t==='wheelp')continue;if(p.t==='swing'){if(vis(p.y-90,p.y+20))drawSwing(p);}else if(p.petal){if(vis(p.y-10,p.y+400))drawPetal(p);}else if(vis(p.y-10,p.y+90))drawIsle(p);}
  for(const h of hogs)if(vis(h.b.y-40,h.b.y+10))drawHog(h);
  for(const w of winds)if(vis(w.y1,w.y0))drawWind(w);
  for(const v of climbV)if(vis(v.y0,v.y1))drawClimbVine(v);
  for(const h of hatItems)if(vis(h.y-20,h.y+20))drawHatItem(h);
  for(const s of spikes)if(vis(s.y-20,s.y))drawSpikes(s);
  for(const b of bouncers)if(vis(b.y-30,b.y))drawBouncer(b);
  for(const c of crystals)if(vis(c.y-30,c.py))drawCrystal(c);
  for(const c of cheeses)if(!c.got&&vis(c.y-10,c.y+10))drawCheese(c.x,c.y+Math.sin(T*3+c.x*.05)*2);
  for(const q of pends)if(vis(q.ay-70,q.y+20))drawPend(q);
  drawButterflies();drawMarker();
  if(P.dead<=0)drawMouse();
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;circ(p.x,p.y,p.r);}ctx.globalAlpha=1;
  for(const n of niches)if(vis(n.y-40,n.y))drawCurtain(n);
  for(const h of hides)if(vis(h.y-40,h.y+20))drawHide(h);
  drawFtx();
  drawMist();
  ctx.restore();drawAmb();drawFG();hud();ctx.restore();}
hasSave=loadProgress();openMenu('start');
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;dt0=dt;update(dt);draw();musicTick();ambientTick();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
